<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hasan Tarla — Uygulamalar</title>
<meta name="description" content="Hasan Tarla tarafından geliştirilen Android ve iOS uygulamaları. Harfora ve Harfora Premium kelime uygulamaları.">
<link rel="canonical" href="https://hasantarla.github.io/">
<link rel="icon" href="assets/icon-v1.png" type="image/png">
<meta property="og:type" content="website">
<meta property="og:locale" content="tr_TR">
<meta property="og:title" content="Hasan Tarla — Uygulamalar">
<meta property="og:description" content="Android ve iOS uygulamaları: Harfora ve Harfora Premium.">
<meta property="og:url" content="https://hasantarla.github.io/">
<style>
  :root{
    --fg:#0f1d33; --muted:#5b6b83; --bg:#f4f7fb; --card:#ffffff; --line:#e2e9f3;
    --brand:#1769C4; --brand-dark:#082C6A;
  }
  @media (prefers-color-scheme: dark){
    :root{ --fg:#e8eef7; --muted:#9aa9be; --bg:#0b1220; --card:#131e33; --line:#22314d; }
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--fg); font-size:17px; line-height:1.6;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  main{max-width:640px; margin:0 auto; padding:40px 18px 64px}
  h1{font-size:1.7rem; margin:0 0 4px; letter-spacing:-.3px}
  .sub{color:var(--muted); margin:0 0 28px; font-size:.95rem}

  .app{
    display:flex; gap:14px; align-items:center; text-decoration:none; color:inherit;
    background:var(--card); border:1px solid var(--line); border-radius:16px;
    padding:14px 16px; margin:0 0 12px; box-shadow:0 2px 12px rgba(8,44,106,.05);
  }
  .app:hover{border-color:var(--brand)}
  .app img{width:58px; height:58px; border-radius:13px; flex:0 0 auto}
  .app .txt{flex:1 1 auto; min-width:0}
  .app .name{font-weight:700; font-size:1.02rem; display:block}
  .app .desc{color:var(--muted); font-size:.87rem; display:block; margin-top:2px}
  .app .go{color:var(--brand); font-weight:700; font-size:1.1rem; flex:0 0 auto}

  footer{margin-top:28px; text-align:center; font-size:.88rem; color:var(--muted)}
  footer a{color:var(--brand); text-decoration:none}
  footer a:hover{text-decoration:underline}
  footer .links{margin-bottom:10px}
  footer .links a{margin:0 8px; white-space:nowrap}
</style>
</head>
<body>
<main>
  <h1>Hasan Tarla</h1>
  <p class="sub">Mobil uygulamalar · Android &amp; iOS</p>

  <a class="app" href="harfora/">
    <img src="assets/icon-v1.png" alt="Harfora uygulama simgesi" width="58" height="58">
    <span class="txt">
      <span class="name">Harfora - Kelime Bulucu</span>
      <span class="desc">Türkçe kelime oyunlarında en yüksek puanlı hamle</span>
    </span>
    <span class="go" aria-hidden="true">›</span>
  </a>

  <a class="app" href="harfora/">
    <img src="assets/icon-v2.png" alt="Harfora Premium uygulama simgesi" width="58" height="58">
    <span class="txt">
      <span class="name">Harfora Premium Kelime Bulucu</span>
      <span class="desc">Yeni nesil, gelişmiş kelime çözümleyici</span>
    </span>
    <span class="go" aria-hidden="true">›</span>
  </a>

  <footer>
    <div class="links">
      <a href="privacy.html">Gizlilik Politikası</a>
      <a href="mailto:hasantarla.apps@gmail.com">İletişim</a>
    </div>
  </footer>
</main>
</body>
</html>
